[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "comfyui-better-gemini"
description = "ComfyUI V3 nodes for Gemini and Grok image/text generation plus OpenRouter image generation."
dependencies = ["google-genai>=0.5.0"]
version = "1.3.0"
requires-python = ">=3.9"
license = "MIT"
classifiers = [
    "Operating System :: OS Independent",
]


[project.urls]
Repository = "https://github.com/ttulttul/Better-Gemini"

[tool.comfy]
PublisherId = "ttulttul"
DisplayName = "ComfyUI-Better-Gemini"

[dependency-groups]
dev = []
